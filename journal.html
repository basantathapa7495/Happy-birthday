<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aurora – Daily Journal</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      margin: 1;
      padding: 8px;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      color: #222;
    }
    .journal-container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 26px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .entry {
      margin-bottom: 20px;
    }
    .entry label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: #444;
    }
    .entry textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 50px;
    }
    button {
      background: #6c63ff;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
      display: block;
      width: 100%;
    }
    button:hover {
      background: #5a52d4;
    }
  </style>
</head>
<body>
  <h1>🌌 Aurora – Daily Journal</h1>
  <div class="journal-container">
    
    <div class="entry">
      <label>1. What is the best thing that happened today?</label>
      <textarea placeholder="Example: I finished reading two chapters of Atomic Habits."></textarea>
    </div>
    
    <div class="entry">
      <label>2. What challenged you today?</label>
      <textarea placeholder="Example: I struggled to focus in the afternoon due to the heat."></textarea>
    </div>
    
    <div class="entry">
      <label>3. What will you do better tomorrow?</label>
      <textarea placeholder="Example: Sleep earlier so I can wake up at 6am."></textarea>
    </div>
    
    <div class="entry">
      <label>4. Happiest moment of the day?</label>
      <textarea placeholder="Example: Laughing with my friend during dinner."></textarea>
    </div>
    
    <div class="entry">
      <label>5. What are you grateful for?</label>
      <textarea placeholder="Example: Grateful for having supportive family."></textarea>
    </div>
    
    <div class="entry">
      <label>6. Lesson you learned today?</label>
      <textarea placeholder="Example: Consistency matters more than intensity."></textarea>
    </div>
    
    <div class="entry">
      <label>7. Where did you waste time today?</label>
      <textarea placeholder="Example: Scrolled on TikTok for 1 hour without purpose."></textarea>
    </div>
    
    <div class="entry">
      <label>8. Future action to improve?</label>
      <textarea placeholder="Example: Block social media during work hours."></textarea>
    </div>
    
    <div class="entry">
      <label>9. Who did you help today?</label>
      <textarea placeholder="Example: Helped my roommate with his homework."></textarea>
    </div>
    
    <div class="entry">
      <label>10. What did you focus on today?</label>
      <textarea placeholder="Example: Focused on writing my YouTube script."></textarea>
    </div>
    
    <div class="entry">
      <label>11. Energy level check (1–10)?</label>
      <textarea placeholder="Example: 6 – I felt productive in the morning but tired at night."></textarea>
    </div>
    
    <div class="entry">
      <label>12. Weather today?</label>
      <textarea placeholder="Example: Hot morning, rainy evening."></textarea>
    </div>
    
    <div class="entry">
      <label>13. Reminder of your big WHY?</label>
      <textarea placeholder="Example: I want financial freedom and to support my family."></textarea>
    </div>
    
    <div class="entry">
      <label>14. Did you exercise or move your body?</label>
      <textarea placeholder="Example: Walked for 30 minutes in the evening."></textarea>
    </div>
    
    <div class="entry">
      <label>15. Did you eat healthy?</label>
      <textarea placeholder="Example: Ate fruits but skipped vegetables."></textarea>
    </div>
    
    <div class="entry">
      <label>16. How many hours did you sleep last night?</label>
      <textarea placeholder="Example: 7 hours – but went to bed late."></textarea>
    </div>
    
    <div class="entry">
      <label>17. Did you practice any new skill?</label>
      <textarea placeholder="Example: Learned video editing in CapCut."></textarea>
    </div>
    
    <div class="entry">
      <label>18. Did you read or study?</label>
      <textarea placeholder="Example: Read 10 pages of Atomic Habits."></textarea>
    </div>
    
    <div class="entry">
      <label>19. What inspired you today?</label>
      <textarea placeholder="Example: A YouTube video about discipline."></textarea>
    </div>
    
    <div class="entry">
      <label>20. Did you spend money wisely?</label>
      <textarea placeholder="Example: Avoided buying junk food."></textarea>
    </div>
    
    <div class="entry">
      <label>21. What scared you today?</label>
      <textarea placeholder="Example: Fear of failing in my YouTube channel."></textarea>
    </div>
    
    <div class="entry">
      <label>22. How did you relax?</label>
      <textarea placeholder="Example: Listened to calm music before sleep."></textarea>
    </div>
    
    <div class="entry">
      <label>23. Who or what made you smile?</label>
      <textarea placeholder="Example: My friend cracked a funny joke."></textarea>
    </div>
    
    <div class="entry">
      <label>24. What habit are you proud of today?</label>
      <textarea placeholder="Example: I didn’t skip journaling."></textarea>
    </div>
    
    <div class="entry">
      <label>25. One word to describe today?</label>
      <textarea placeholder="Example: Progress."></textarea>
    </div>
    
        <div class="entry">
      <label>26. Did you manage distractions well today?</label>
      <textarea placeholder="Example: Turned off notifications while working."></textarea>
    </div>

    <div class="entry">
      <label>27. Did you stay disciplined with your routine?</label>
      <textarea placeholder="Example: Woke up at 6am and followed morning routine."></textarea>
    </div>

    <div class="entry">
      <label>28. Did you control your emotions today?</label>
      <textarea placeholder="Example: Stayed calm when friend disagreed with me."></textarea>
    </div>

    <div class="entry">
      <label>29. Did you connect with someone important?</label>
      <textarea placeholder="Example: Called my brother to check on him."></textarea>
    </div>

    <div class="entry">
      <label>30. Did you avoid negative influences?</label>
      <textarea placeholder="Example: Didn’t waste time gossiping."></textarea>
    </div>

    <div class="entry">
      <label>31. Did you face a fear or step out of comfort zone?</label>
      <textarea placeholder="Example: Spoke up in a group discussion."></textarea>
    </div>

    <div class="entry">
      <label>32. Did you track your expenses?</label>
      <textarea placeholder="Example: Noted Rs.150 spent on lunch."></textarea>
    </div>

    <div class="entry">
      <label>33. Did you meditate or practice mindfulness?</label>
      <textarea placeholder="Example: 5 minutes of deep breathing."></textarea>
    </div>

    <div class="entry">
      <label>34. Did you practice gratitude beyond journaling?</label>
      <textarea placeholder="Example: Thanked my friend for his help today."></textarea>
    </div>

    <div class="entry">
      <label>35. Did you avoid procrastination?</label>
      <textarea placeholder="Example: Finished editing video on time."></textarea>
    </div>

    <div class="entry">
      <label>36. Did you drink enough water?</label>
      <textarea placeholder="Example: Drank 2 liters today."></textarea>
    </div>

    <div class="entry">
      <label>37. Did you spend time offline?</label>
      <textarea placeholder="Example: 1 hour walk without phone."></textarea>
    </div>

    <div class="entry">
      <label>38. Did you manage money wisely?</label>
      <textarea placeholder="Example: Saved Rs.50 today."></textarea>
    </div>

    <div class="entry">
      <label>39. Did you create something today?</label>
      <textarea placeholder="Example: Made a new YouTube script."></textarea>
    </div>

    <div class="entry">
      <label>40. Did you work toward your long-term goal?</label>
      <textarea placeholder="Example: Researched about online business."></textarea>
    </div>

    <div class="entry">
      <label>41. Did you take care of your relationships?</label>
      <textarea placeholder="Example: Spent time with my parents on call."></textarea>
    </div>

    <div class="entry">
      <label>42. Did you avoid complaining?</label>
      <textarea placeholder="Example: Focused on solutions instead of problems."></textarea>
    </div>

    <div class="entry">
      <label>43. Did you practice self-discipline?</label>
      <textarea placeholder="Example: Avoided eating junk food even when tempted."></textarea>
    </div>

    <div class="entry">
      <label>44. Did you keep promises to yourself?</label>
      <textarea placeholder="Example: I promised to journal and I did."></textarea>
    </div>

    <div class="entry">
      <label>45. Did you use your time wisely?</label>
      <textarea placeholder="Example: Spent most of the evening learning instead of scrolling."></textarea>
    </div>

    <div class="entry">
      <label>46. Did you face any obstacles today?</label>
      <textarea placeholder="Example: Internet went down during work."></textarea>
    </div>

    <div class="entry">
      <label>47. What mindset did you carry most of the day?</label>
      <textarea placeholder="Example: Positive but a little impatient."></textarea>
    </div>

    <div class="entry">
      <label>48. Did you spend money on needs or wants?</label>
      <textarea placeholder="Example: Bought food (need), skipped clothes (want)."></textarea>
    </div>

    <div class="entry">
      <label>49. Did you push yourself beyond average?</label>
      <textarea placeholder="Example: Worked extra 30 minutes on my project."></textarea>
    </div>

    <div class="entry">
      <label>50. Final reflection: How do you feel ending the day?</label>
      <textarea placeholder="Example: Proud, because I moved one step forward."></textarea>
    </div>

    
    <button>Save Today’s Journal</button>
  </div>
</body>
</html>
